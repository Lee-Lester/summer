<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>小亮 ❤️ 瑶瑶 · 拾光馆</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        /* ===== 全局重置 & 基础 ===== */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --rose: #e8878a;
            --rose-dark: #c96b6e;
            --rose-light: #f9e0de;
            --text-dark: #4a3335;
            --text-medium: #7a5c5e;
            --white: #ffffff;
            --shadow: 0 4px 20px rgba(180, 120, 130, 0.12);
            --shadow-hover: 0 12px 32px rgba(140, 80, 90, 0.25);
            --radius: 24px;
        }
        body {
            font-family: 'PingFang SC', 'Microsoft YaHei', 'Helvetica Neue', sans-serif;
            background: linear-gradient(170deg, #fef5f0 0%, #fce8e6 20%, #fdf0ed 40%, #fef6f2 60%, #fbe9e7 80%);
            min-height: 100vh;
            color: var(--text-dark);
            overflow-x: hidden;
            transition: background 0.8s, color 0.8s; /* 色彩平滑过渡 */
        }
        
        /* ===== 高定粒子画布 ===== */
        #particleCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none; /* 保证鼠标事件可以穿透，不影响点击按钮和输入 */
            z-index: 0;
        }

        /* ===== 核心 App 容器 ===== */
        #app {
            position: relative;
            z-index: 1;
            display: none;
            opacity: 0;
            transition: opacity 0.6s ease;
        }
        #app.visible { display: block; opacity: 1; }
        
        /* ===== 夜间模式变量重写 ===== */
        body.night-mode {
            background: linear-gradient(170deg, #1a1c2b 0%, #2d1f3d 40%, #1e2a38 80%) !important;
        }
        body.night-mode :root {
            --rose: #a78bfa;
            --rose-dark: #7c3aed;
            --rose-light: #312e81;
            --text-dark: #e0d7fe;
            --text-medium: #a5b4fc;
        }

        /* ===== 原页面的功能样式片段（精简保留） ===== */
        .scene { width:100%; min-height:100vh; display:flex; flex-direction:column; align-items:center; padding:20px; }
        .front { display:flex; } .back { display:none; }
        .front.hidden { display:none; } .back.visible { display:flex; }
        .hero-icon { font-size:56px; animation:bounce 2s infinite; }
        @keyframes bounce { 0%,100%{transform:translateY(0)} 15%{transform:translateY(-18px)} 30%{transform:translateY(0)} 45%{transform:translateY(-8px)} }
        .hero-title { font-size:2.5rem; font-weight:700; margin:18px 0; background:linear-gradient(135deg,#d4777a,#c06063); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
        .timer-box { background:rgba(255,255,255,0.75); backdrop-filter:blur(12px); border-radius:var(--radius); padding:20px 30px; margin:20px auto; display:flex; gap:20px; justify-content:center; box-shadow:var(--shadow); max-width:500px; flex-wrap:wrap; }
        .timer-block { text-align:center; min-width:56px; }
        .timer-num { font-size:2.2rem; font-weight:700; color:var(--rose-dark); }
        .photos { display:grid; grid-template-columns:repeat(2,1fr); gap:20px; max-width:600px; margin:20px auto; }
        .polaroid { background:white; padding:10px 10px 25px; border-radius:6px; box-shadow:var(--shadow); transition:0.3s; transform:rotate(var(--r,0)); }
        .polaroid:nth-child(1){--r:-2deg} .polaroid:nth-child(2){--r:2deg} .polaroid:nth-child(3){--r:2.5deg} .polaroid:nth-child(4){--r:-1.5deg}
        .polaroid img { width:100%; aspect-ratio:4/5; object-fit:cover; border-radius:3px; background:#f5f0ed; }
        .polaroid p { text-align:center; margin-top:8px; font-size:0.85rem; color:var(--text-medium); }
        .enter-btn { margin:30px 0; padding:14px 40px; border:none; border-radius:60px; background:linear-gradient(135deg,#e8878a,#d47073); color:white; font-size:1.2rem; font-weight:600; cursor:pointer; box-shadow:0 6px 20px rgba(200,110,115,0.3); transition:0.3s; }
        .enter-btn:hover { transform:translateY(-2px); box-shadow:0 10px 28px rgba(200,110,115,0.45); }
        .garden-header { background:rgba(255,255,255,0.7); backdrop-filter:blur(10px); border-radius:40px; padding:12px 20px; display:flex; align-items:center; justify-content:space-between; margin-bottom:24px; box-shadow:var(--shadow); flex-wrap:wrap; gap:10px; }
        .tabs { display:flex; gap:4px; background:rgba(255,255,255,0.5); border-radius:30px; padding:4px; flex-wrap:wrap; }
        .tab { padding:8px 18px; border-radius:30px; border:none; background:transparent; font-weight:600; color:var(--text-medium); cursor:pointer; transition:0.2s; font-size:0.9rem; white-space:nowrap; }
        .tab.active { background:white; color:var(--rose-dark); box-shadow:0 2px 8px rgba(180,100,110,0.15); }
        .back-btn { background:rgba(255,255,255,0.6); border:1px solid rgba(200,160,165,0.3); border-radius:30px; padding:6px 18px; cursor:pointer; font-weight:500; color:var(--text-medium); transition:0.2s; font-size:0.9rem; }
        .back-btn:hover { background:white; border-color:var(--rose); }
        .panel { display:none; animation:fadeUp 0.3s ease; }
        .panel.active { display:block; }
        @keyframes fadeUp { 0%{opacity:0;transform:translateY(12px)} 100%{opacity:1;transform:translateY(0)} }
        .card { background:rgba(255,255,255,0.8); backdrop-filter:blur(10px); border-radius:var(--radius); padding:20px; margin-bottom:20px; box-shadow:var(--shadow); }
        .btn { padding:8px 20px; border-radius:30px; border:none; cursor:pointer; font-weight:600; transition:0.2s; background:white; color:var(--text-dark); box-shadow:0 2px 8px rgba(0,0,0,0.04); font-size:0.9rem; }
        .btn.primary { background:linear-gradient(135deg,#e8878a,#d47073); color:white; }
        .btn-outline { background:transparent; border:1.5px solid var(--rose); color:var(--rose-dark); }
        .check-item, .task-item { display:flex; align-items:center; gap:12px; padding:10px 0; border-bottom:1px solid rgba(200,160,165,0.15); }
        .task-status { font-size:1.8rem; cursor:pointer; user-select:none; min-width:44px; text-align:center; transition:0.2s; }
        .task-period-group .period-title { font-weight:600; color:var(--rose-dark); margin-bottom:4px; font-size:0.95rem; border-left:3px solid var(--rose); padding-left:8px; }
        .task-date-nav { display:flex; align-items:center; gap:16px; margin-bottom:12px; flex-wrap:wrap; }
        .task-date-nav .date-label { font-weight:600; font-size:1.1rem; min-width:120px; text-align:center; }
        .task-add-area { display:flex; gap:10px; flex-wrap:wrap; margin-bottom:16px; }
        
        /* 音乐播放器依然保留 */
        .music-player { position:fixed; bottom:30px; right:30px; z-index:999; display:flex; flex-direction:column; align-items:flex-end; pointer-events: auto; }
        .music-toggle { width:52px; height:52px; border-radius:50%; background:rgba(255,255,255,0.85); backdrop-filter:blur(10px); box-shadow:0 4px 16px rgba(0,0,0,0.08); border:none; font-size:24px; cursor:pointer; display:flex; align-items:center; justify-content:center; }
        .music-panel { background:rgba(255,255,255,0.9); backdrop-filter:blur(12px); border-radius:16px; padding:16px; margin-bottom:8px; width:280px; box-shadow:0 8px 32px rgba(0,0,0,0.12); }
        
        /* 隐藏源图 */
        #highDefImage { display: none; }
        
        @media (max-width:700px) { .photos{grid-template-columns:1fr 1fr;gap:12px} .hero-title{font-size:1.8rem} }
    </style>
</head>
<body>
    <!-- 隐藏的粒子生成源图片，请重命名你的高精度照片为 princess_particle.jpg -->
    <img id="highDefImage" src="./princess_particle.jpg" crossorigin="anonymous" />

    <!-- 高定粒子画布，作为功能页面的底色 -->
    <canvas id="particleCanvas"></canvas>

    <!-- 音乐播放器 -->
    <div id="musicPlayer" class="music-player">
        <button class="music-toggle" id="musicToggle">🎵</button>
        <div class="music-panel" id="musicPanel" style="display:none;">

            </div>

    <div id="app">
        <!-- 完整的前台相册、日记、打卡等全部功能页面 -->
        <div id="frontScene" class="scene front">
            <div style="max-width:700px;width:100%;">
                <div style="text-align:center;padding-top:30px;">
                    <span class="hero-icon">💝</span>
                    <h1 class="hero-title">致我最可爱的瑶瑶</h1>
                    <p id="homeSubtitle">遇见你，是小亮此生意外的美好 ✨</p>
                </div>
                <div class="timer-box" style="flex-direction:column;padding:20px 25px;">
                    <div style="font-size:0.95rem;color:var(--rose-dark);font-weight:600;text-align:center;">✨ 这个月，也要一起写满我们的故事呀！</div>
                    <div style="font-size:0.85rem;color:var(--text-medium);text-align:center;">💕 距离我们相识，已经过去了</div>
                    <div style="display:flex;gap:12px;justify-content:center;">
                        <div class="timer-block"><span class="timer-num" id="tMonths">0</span><span class="timer-label">个月</span></div>

                        <div class="timer-block"><span class="timer-num" id="tSecs">00</span><span class="timer-label">秒</span></div>
                    </div>
                </div>
                <!-- 相册保留了原有的 princess.jpg, 不会受影响，因为我们底层读取的是 princess_particle.jpg -->
                <div class="photos">

                    <div class="polaroid"><img src="./smile.jpg" onerror="this.style.display='none'" /><p>你的笑容 ☀️</p></div>
                    <div class="polaroid"><img src="./smirk.jpg" onerror="this.style.display='none'" /><p>可爱的坏笑 😏</p></div>
                    <div class="polaroid"><img src="./beam.jpg" onerror="this.style.display='none'" /><p>光芒万丈 ✨</p></div>
                </div>
                <div style="text-align:center;margin:20px 0;"><button id="heartBtn" style="background:none;border:none;font-size:36px;cursor:pointer;">❤️</button><p id="heartCountDisplay">收到了 0 颗爱心</p></div>
                <div style="text-align:center;"><button class="enter-btn" id="enterGarden">🌸 进入拾光馆</button></div>
            </div>
        </div>

        <div id="gardenScene" class="scene back">
            <div style="max-width:1000px;width:100%;">
                <div class="garden-header">
                    <span class="brand">📖 拾光馆</span>
                    <div class="tabs" id="mainTabs">
                        <button class="tab active" data-tab="diary">📝 日记</button>
                        <button class="tab" data-tab="checkin">☑️ 打卡</button>
                        <button class="tab" data-tab="wishes">🌟 心愿</button>
                        <button class="tab" data-tab="tasks">🎯 任务</button>
                        <button class="tab" data-tab="messages">💌 留言</button>
                        <button class="tab" data-tab="money">💰 私房钱</button>
                    </div>
                    <button class="back-btn" id="backToFront">🏠 返回</button>
                    <button id="logoutBtn" style="background:#e8878a;border:none;border-radius:30px;padding:6px 18px;color:white;font-weight:bold;">🚪 退出账号</button>
                </div>

                <div id="panel-diary" class="panel active">
                    <div class="card">
                        <div style="display:flex;gap:12px;align-items:center;margin-bottom:12px;">
                            <span>心情</span>
                            <div class="mood-selector" id="moodSel">
                                <span class="mood selected" data-mood="🥰">🥰</span><span class="mood" data-mood="😊">😊</span><span class="mood" data-mood="😢">😢</span><span class="mood" data-mood="😤">😤</span><span class="mood" data-mood="🎉">🎉</span>
                            </div>
                        </div>
                        <textarea id="diaryContent" rows="4" placeholder="今天发生了什么甜蜜的事…"></textarea>

                <div id="panel-checkin" class="panel">

                        <input type="text" id="newCheckItem" placeholder="新建打卡项目" style="flex:2;" />
                        <select id="checkTypeSelect">
                            <option value="双人">💕 双人</option>

                            <option value="cec4c9cb-9f6d-4d45-a5de-6845951b3709">💗 瑶瑶</option>

                    </div>
                    <div class="card" style="display:flex;align-items:center;gap:12px;">
                        <span>📌 查看打卡：</span>

                </div>

                <div id="panel-wishes" class="panel">
                    <div class="card" style="display:flex;gap:10px;">
                        <input type="text" id="newWish" placeholder="写下想一起做的事…" style="flex:1;" />
                        <button class="btn primary" id="addWishBtn">➕ 添加</button>
                    </div>
                    <div id="wishList"></div>
                </div>

                <div id="panel-tasks" class="panel">
                    <div class="card">
                        <div class="task-date-nav">
                            <button id="taskPrevDay">◀</button><span id="taskDateLabel">今天</span><button id="taskNextDay">▶</button><button class="btn btn-sm" id="taskTodayBtn">今天</button>
                        </div>
                        <div class="task-add-area">
                            <input type="text" id="newTaskInput" placeholder="输入任务…" />
                            <select id="newTaskPeriod"><option>上午</option><option>下午</option><option>晚上</option><option>其他</option></select>
                            <button class="btn primary" id="addTaskBtn">➕ 添加</button>
                        </div>
                        <div id="taskList"></div>
                    </div>
                </div>

                <div id="panel-money" class="panel">
                    <div class="card">
                        <div style="display:flex;gap:10px;margin-bottom:12px;">
                            <select id="moneyType"><option value="income">💰 存入</option><option value="expense">💸 支出</option></select>
                            <input type="number" id="moneyAmount" placeholder="金额" step="0.01" min="0.01" />
                            <input type="text" id="moneyDesc" placeholder="备注" />

                        </div>

                    </div>

                <div id="panel-messages" class="panel">
                    <div class="card" style="display:flex;gap:10px;">
                        <input type="text" id="newMsg" placeholder="给 Ta 写句话…" style="flex:1;" />

    </div>

    <!-- ======= 第一部分核心脚本，含数据读取和升级版粒子初始化 ======= -->
    <script>
        const SUPABASE_URL = 'https://ldqauibuqwpwwtjoihjk.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxkcWF1aWJ1cXdwd3d0am9paGprIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUyMjA5MjMsImV4cCI6MjEwMDc5NjkyM30.PxxJn1IKE4ck3WszrmPGr5gcL_j7wcmPjawHMbhlhcU';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // -------------------------------------------------------------
        // 高定粒子提取与背景逻辑
        // -------------------------------------------------------------
        const highDefImg = document.getElementById('highDefImage');
        const canvas = document.getElementById('particleCanvas');
        const ctx = canvas.getContext('2d', { willReadFrequently: true });
        let highDefParticles = [];

        function generateHighDefParticles() {
            if (!highDefImg.complete || highDefImg.naturalWidth === 0) {
                console.warn('等待 princess_particle.jpg 加载...');
                return;
            }
            const winW = window.innerWidth, winH = window.innerHeight;
            canvas.width = winW; canvas.height = winH;

            const ratio = highDefImg.naturalWidth / highDefImg.naturalHeight;
            let drawW, drawH;
            if (winW / winH > ratio) { drawH = winH; drawW = winH * ratio; } 
            else { drawW = winW; drawH = drawW / ratio; }

            const tempCanvas = document.createElement('canvas');
            tempCanvas.width = drawW; tempCanvas.height = drawH;
            const tempCtx = tempCanvas.getContext('2d');
            tempCtx.drawImage(highDefImg, 0, 0, drawW, drawH);
            const imgData = tempCtx.getImageData(0, 0, drawW, drawH);
            const data = imgData.data;
            
            const centerX = (winW - drawW) / 2, centerY = (winH - drawH) / 2;
            highDefParticles = [];
            const STEP = 3; // 步长越小，身形、嘴唇、手臂越清晰！性能佳可调为 2
            
            for (let y = 0; y < drawH; y += STEP) {
                for (let x = 0; x < drawW; x += STEP) {
                    const idx = (y * drawW + x) * 4;
                    const r = data[idx], g = data[idx + 1], b = data[idx + 2], a = data[idx + 3];
                    if (a > 128 && (r > 20 || g > 20 || b > 20)) {
                        const color = `rgb(${r}, ${g}, ${b})`;
                        highDefParticles.push({
                            targetX: centerX + x, targetY: centerY + y,
                            color: color,
                            phase: Math.random() * Math.PI * 2,
                            baseSize: 0.6 + (r + g + b) / (3 * 255) * 1.6,
                            baseAlpha: 0.6 + (r + g + b) / (3 * 255) * 0.4
                        });
                    }
                }
            }
            console.log(`✅ 高定特征粒子提取完成，共 ${highDefParticles.length} 个 (包含嘴唇、轮廓、衣物细节)`);
            animateParticles();
        }
                // ==========================================================
        // 【第二部分】高定粒子呼吸动画、夜间联动与原完整功能逻辑
        // ==========================================================

        // --- 1. 粒子呼吸闪烁与夜间联动动画 ---
        function animateParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            const time = Date.now();
            const isNight = document.body.classList.contains('night-mode');
            // 夜间辉光更柔和，宛如静谧星海
            const glowColor = isNight ? 'rgba(167, 139, 250, 0.25)' : 'rgba(255, 182, 185, 0.3)';
            
            for (let i = 0; i < highDefParticles.length; i++) {
                const p = highDefParticles[i];
                // 根据相位差缓慢呼吸，形成星海波动
                const breath = 0.6 + 0.4 * Math.sin(time / 1800 + p.phase);
                const size = p.baseSize * breath;
                const alpha = p.baseAlpha * (isNight ? breath * 0.8 : breath); // 夜间不刺眼

                ctx.beginPath();
                ctx.arc(p.targetX, p.targetY, Math.max(0.5, size), 0, Math.PI * 2);
                ctx.closePath();
                ctx.globalAlpha = alpha;
                ctx.shadowColor = glowColor;
                ctx.shadowBlur = isNight ? 12 : 16; // 夜晚柔光
                ctx.fillStyle = p.color;
                ctx.fill();
            }
            ctx.shadowBlur = 0;
            requestAnimationFrame(animateParticles);
        }

        // --- 2. 窗口缩放防抖重绘 ---
        let resizeTimer;
        window.addEventListener('resize', function() {
            clearTimeout(resizeTimer);
            resizeTimer = setTimeout(() => generateHighDefParticles(), 300);
        });

        // 加载完成后生成一次粒子
        if (highDefImg.complete) generateHighDefParticles();
        else highDefImg.onload = generateHighDefParticles;

        // --- 3. 夜间模式自动切换 & 联动 ---
        function checkLateNight() {
            const hour = new Date().getHours();
            const isNight = hour >= 19 || hour < 6;
            document.body.classList.toggle('night-mode', isNight);
            
            const p = document.getElementById('homeSubtitle');
            if (isNight) {
                p.textContent = '夜深了，星星在说我想你 🌙';
                p.style.color = '#c0b9dd';
            } else {
                p.textContent = '遇见你，是小亮此生意外的美好 ✨';
                p.style.color = 'var(--text-medium)';
            }
        }
        checkLateNight();
        setInterval(checkLateNight, 60000);

        // ==========================================================
        // 以下为你原网页完整的后端数据库逻辑与 BUG 修复
        // ==========================================================

        const LOVE_START = new Date('2026-07-01T14:05:00');
        const STORAGE_BUCKET = 'diary-files';
        const VOICE_BUCKET = 'voice-diary';
        let currentUser = null, currentEditId = null, currentTaskDate = new Date();
        const taskStatusMap = {0:'☐',1:'◐',2:'✅'}, taskStatusNext = {0:1,1:2,2:0};
        let selectedCheckinId = null;

        // --- 4. 登录认证 ---
        async function checkAuth() {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (!session) { showLoginModal(); return null; }
            const allowedEmails = ['wolves_champion@outlook.com', '15388451317@163.com'];
            if (!allowedEmails.includes(session.user.email)) { 
                await supabaseClient.auth.signOut(); 
                showLoginModal('邮箱不在允许列表'); 
                return null; 
            }
            return session;
        }
        function showLoginModal(msg='') {
            const old = document.getElementById('loginModal'); if (old) old.remove();
            const modal = document.createElement('div'); modal.id = 'loginModal';
            modal.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);backdrop-filter:blur(8px);z-index:99999;display:flex;align-items:center;justify-content:center;';
            modal.innerHTML = `<div style="background:white;padding:40px;border-radius:24px;max-width:400px;width:90%;text-align:center;">
                <div style="font-size:3rem;">🔐</div><h2>拾光馆</h2><p>仅限小亮和瑶瑶</p>
                <input type="email" id="loginEmail" placeholder="邮箱" style="width:100%;margin-bottom:12px;padding:10px;border-radius:12px;border:1px solid #f0d3d5;" />
                <input type="password" id="loginPassword" placeholder="密码" style="width:100%;margin-bottom:24px;padding:10px;border-radius:12px;border:1px solid #f0d3d5;" />
                <button id="loginSubmitBtn" style="width:100%;padding:12px;border:none;border-radius:12px;background:linear-gradient(135deg,#e8878a,#d47073);color:white;font-weight:600;">🌸 进入拾光馆</button>
                <p id="loginError" style="color:#d47073;margin-top:12px;display:${msg?'block':'none'};">${msg||'登录失败'}</p>
            </div>`;
            document.body.appendChild(modal);
            document.getElementById('loginSubmitBtn').addEventListener('click', async () => {
                const email = document.getElementById('loginEmail').value.trim();
                const password = document.getElementById('loginPassword').value.trim();
                if(!email||!password) return;
                const { error } = await supabaseClient.auth.signInWithPassword({email,password});
                if(error) { document.getElementById('loginError').textContent='登录失败：'+error.message; document.getElementById('loginError').style.display='block'; }
                else location.reload();
            });
        }

        // --- 5. 音乐播放器 ---
        const songList = [
            { name: '我想念', artist: '汪苏泷', src: 'https://ldqauibuqwpwwtjoihjk.supabase.co/storage/v1/object/public/music/Wang%20Sulong%20I%20miss%20you.mp3' },
            { name: 'Love Story', artist: 'Taylor Swift', src: 'https://ldqauibuqwpwwtjoihjk.supabase.co/storage/v1/object/public/music/Taylor%20Swift-Love%20Story.mp3' }
        ];
        let currentSongIndex=0, isPlaying=false;
        const audio = new Audio(); audio.volume=0.6;
        function togglePlay() { audio.paused?(audio.play().catch(()=>{}),isPlaying=true):(audio.pause(),isPlaying=false); updateMusicUI(); }
        function nextSong() { currentSongIndex=(currentSongIndex+1)%songList.length; audio.src=songList[currentSongIndex].src; audio.play(); isPlaying=true; updateMusicUI(); }
        function prevSong() { currentSongIndex=currentSongIndex-1<0?songList.length-1:currentSongIndex-1; audio.src=songList[currentSongIndex].src; audio.play(); isPlaying=true; updateMusicUI(); }
        function updateMusicUI() {
            document.getElementById('currentSongName').textContent = songList[currentSongIndex]?.name||'未播放';
            document.getElementById('playBtn').textContent = isPlaying?'⏸':'▶';
            document.getElementById('musicToggle').classList.toggle('playing', isPlaying);
        }
        document.getElementById('playBtn').addEventListener('click', togglePlay);
        document.getElementById('nextBtn').addEventListener('click', nextSong);
        document.getElementById('prevBtn').addEventListener('click', prevSong);
        document.getElementById('musicToggle').addEventListener('click', (e) => {
            e.stopPropagation(); const panel=document.getElementById('musicPanel');
            panel.style.display = panel.style.display==='none'?'block':'none';
        });

        // --- 6. 打卡逻辑（含长按取消的终极修复与日历刷新） ---
        // 修复1：取消打卡逻辑
        async function cancelCheckin(taskId, dateStr, type) {
            try {
                const { data, error } = await supabaseClient.from('checkins').select('*').eq('id', taskId).single();
                if(error || !data) { alert('数据获取失败'); return; }
                if(type === '个人') {
                    const newDates = (data.dates || []).filter(d => d !== dateStr);
                    await supabaseClient.from('checkins').update({ dates: newDates }).eq('id', taskId);
                } else {
                    let completedBy = data.completed_by || {};
                    if(completedBy[dateStr]) {
                        completedBy[dateStr] = completedBy[dateStr].filter(uid => uid !== currentUser.id);
                        if(completedBy[dateStr].length === 0) delete completedBy[dateStr];
                    }
                    await supabaseClient.from('checkins').update({ 
                        completed_by: completedBy, 
                        dates: Object.keys(completedBy) 
                    }).eq('id', taskId);
                }
                await loadCheckins(); // 重点：强制从数据库重新拉取渲染
            } catch (err) {
                alert('取消失败: ' + err.message);
            }
        }

        // 修复2：长按与点击事件分离
        function addLongPressListeners() {
            document.querySelectorAll('#checkinCalendarContainer [data-date]').forEach(el => {
                let timer, longPressTriggered = false;
                const taskId = el.dataset.taskId, dateStr = el.dataset.date, type = el.dataset.type;
                const start = (e) => {
                    longPressTriggered = false;
                    timer = setTimeout(() => {
                        longPressTriggered = true;
                        if(confirm('确定取消这一天的打卡吗？')) cancelCheckin(taskId, dateStr, type);
                    }, 700);
                };
                const clear = (e) => {
                    clearTimeout(timer);
                    if(!longPressTriggered && dateStr && taskId && type) {
                        clickDateToCheckin(taskId, dateStr, type);
                    }
                    longPressTriggered = false;
                };
                el.addEventListener('mousedown', start);
                el.addEventListener('mouseup', clear);
                el.addEventListener('mouseleave', clear);
                el.addEventListener('touchstart', (e) => { e.preventDefault(); start(e); });
                el.addEventListener('touchend', clear);
                el.addEventListener('touchmove', clear);
            });
        }

        async function clickDateToCheckin(taskId, dateStr, type) {
            const { data } = await supabaseClient.from('checkins').select('*').eq('id', taskId).single();
            let completedBy = data.completed_by||{};
            if(type==='双人') {
                let users = completedBy[dateStr]||[];
                if(users.length>=2 || users.includes(currentUser.id)) return;
                users.push(currentUser.id); completedBy[dateStr] = users;
                await supabaseClient.from('checkins').update({ completed_by:completedBy, dates:Object.keys(completedBy) }).eq('id',taskId);
            } else {
                const dates = data.dates||[];
                if(!dates.includes(dateStr)) dates.push(dateStr);
                await supabaseClient.from('checkins').update({ dates }).eq('id',taskId);
            }
            loadCheckins();
        }

        // 修复3：日历重新渲染，增加 else 分支清除缓存
        function renderCalendar(dates, completedBy, taskTitle, type, taskId) {
            const container = document.getElementById('checkinCalendarContainer');
            const now = new Date(), year = now.getFullYear(), month = now.getMonth();
            const firstDay = new Date(year, month, 1).getDay(), daysInMonth = new Date(year, month+1, 0).getDate();
            const todayStr = new Date().toISOString().split('T')[0];
            let html = `<div style="margin-bottom:10px;font-weight:600;">📅 ${taskTitle}</div>`;
            html += `<div style="display:grid;grid-template-columns:repeat(7,1fr);gap:8px;background:rgba(255,255,255,0.7);padding:20px 14px;border-radius:20px;">`;
            ['日','一','二','三','四','五','六'].forEach(d => html += `<div style="text-align:center;font-size:0.75rem;">${d}</div>`);
            for(let i=0; i<firstDay; i++) html += '<div></div>';
            for(let d=1; d<=daysInMonth; d++) {
                const dateStr = `${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
                const isToday = dateStr===todayStr, isPast = dateStr<=todayStr;
                const users = completedBy[dateStr]||[];
                let bg='background:#fff;', content=`<span>${d}</span>`, cursor='', dataAttrs='';
                if(isPast && taskId) {
                    dataAttrs = `data-date="${dateStr}" data-task-id="${taskId}" data-type="${type}"`;
                    if(!((type==='个人'&&dates.includes(dateStr)) || (type==='双人'&&users.length>=2))) {
                        cursor = 'cursor:pointer;';
                    }
                }
                if(type==='双人') {
                    if(users.length===2) { bg='background:#fce8e6;'; content='💕'; }
                    else if(users.length===1) { bg='background:#fdf5f3;'; content='❤️'; }
                    else { bg='background:#fff;'; content=`<span>${d}</span>`; } // 取消后强制归零
                } else {
                    if(dates.includes(dateStr)) { bg='background:#fef7f5;'; content='❤️'; }
                    else { bg='background:#fff;'; content=`<span>${d}</span>`; } // 取消后强制归零
                }
                if(isToday) { bg += 'border:2px solid #c96b6e;'; content += '<div style="font-size:0.55rem;">✨今天</div>'; }
                html += `<div style="text-align:center;padding:6px 0;border-radius:12px;aspect-ratio:1/1;${bg}${cursor}" ${dataAttrs}>${content}</div>`;
            }
            html += '</div>'; container.innerHTML = html;
            addLongPressListeners();
        }

        async function loadCheckins() {
            const selectEl = document.getElementById('checkinTaskSelect');
            const { data } = await supabaseClient.from('checkins').select('*').order('created_at');
            const currentVal = selectEl.value;
            selectEl.innerHTML = '<option value="">-- 请选择 --</option>';
            if(!data?.length) { document.getElementById('checkinCalendarContainer').innerHTML = '<p>还没有打卡项目</p>'; return; }
            data.forEach(c => {
                const opt = document.createElement('option'); opt.value = c.id;
                opt.textContent = `${c.title} (${c.type==='双人'?'💕':'👤'})`;
                selectEl.appendChild(opt);
            });
            if(currentVal && data.some(c=>c.id===currentVal)) selectEl.value = currentVal;
            else selectEl.value = data[0].id;
            selectedCheckinId = selectEl.value;
            const { data: selectedData } = await supabaseClient.from('checkins').select('dates, completed_by, title, type').eq('id', selectedCheckinId).single();
            if(selectedData) renderCalendar(selectedData.dates||[], selectedData.completed_by||{}, selectedData.title, selectedData.type, selectedCheckinId);
        }

        function updateTimer() {
            const diff = Math.max(0, Date.now()-LOVE_START);
            const secs = Math.floor(diff/1000), mins = Math.floor(secs/60), hours = Math.floor(mins/60), days = Math.floor(hours/24);
            document.getElementById('tMonths').textContent = Math.floor(days/30);
            document.getElementById('tDays').textContent = days%30;
            document.getElementById('tHours').textContent = String(hours%24).padStart(2,'0');
            document.getElementById('tMins').textContent = String(mins%60).padStart(2,'0');
            document.getElementById('tSecs').textContent = String(secs%60).padStart(2,'0');
        }
